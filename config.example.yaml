# Lab Monitor Configuration Example
# Copy this file to config.yaml and update with your actual values

schedule:
  # Times in 24-hour format (HH:MM) for daily reports
  # You can specify as many times as you want
  times:
    - "06:00"
    - "16:00"

channels:
  # ThingSpeak channel configurations
  - id: 1234567  # Your ThingSpeak channel ID
    name: "Lab Name 1"  # Descriptive name for the lab
    temperature_field: "field1"  # ThingSpeak field containing temperature data
    humidity_field: "field2"  # ThingSpeak field containing humidity data

  - id: 7654321  # Your second ThingSpeak channel ID
    name: "Lab Name 2"  # Descriptive name for the second lab
    temperature_field: "field1"
    humidity_field: "field2"

openai:
  # OpenAI model to use for report generation
  # Options: gpt-4o, gpt-4o-mini, gpt-4-turbo, etc.
  model: "gpt-4o"
  # Optional: limit how many back-and-forth rounds the model can request
  # more historical context during a single run. If omitted or 0, defaults to 3.
  # Increase cautiously to balance accuracy vs. latency and API usage.
  max_context_attempts: 3
  # Timeouts & retries (all optional; 0 applies internal defaults)
  # Canonical assessment timeout seconds (default 45)
  initial_timeout_seconds: 45
  # Extended (need-context) re-analysis timeout seconds (default 25)
  extension_timeout_seconds: 25
  # Short request timeout (tone transforms) seconds (default 20)
  request_timeout_seconds: 20
  # Per-profile tone transform timeout (default inherits request timeout)
  tone_timeout_seconds: 20
  # Retry policy for transient errors (429, 5xx, timeouts)
  max_retries: 2
  # Base backoff in ms (exponential with jitter) (default 400)
  retry_backoff_ms: 400

email:
  # Email configuration (uses AWS SES)
  sender: "your-email@example.com"  # Verified sender email in AWS SES
  subject_prefix: "[Lab Monitor]"  # Prefix for email subject lines
  # PROFILES-ONLY (migration): legacy 'recipients' and 'recipients_detailed' are removed.
  # Define one or more profiles that group recipients sharing tone/rendering preferences.
  profiles:
    - name: "engineering"
      recipients:
        - "eng1@example.com"
        - "eng2@example.com"
      # Optional per-profile overrides (fall back to global style if omitted)
      personality: snarky   # overrides global personality
      snark_level: 2        # 0-3, only relevant if personality is snarky/humorous
      use_icons: true       # override global use_icons
      use_color: true       # override global use_color
    - name: "management"
      recipients:
        - "mgr@example.com"
      personality: friendly
      snark_level: 0
      use_icons: true
      use_color: true
    - name: "neutral_archive"
      recipients:
        - "archive@example.com"
      # No overrides -> inherits global neutral tone

state:
  # Local state storage configuration
  directory: "state"  # Directory to store historical data
  history_per_lab: 5  # Number of past reports to keep per lab

style:
  # Personality options: neutral (default), friendly, snarky, humorous
  personality: neutral
  # 0-3; only applies to snarky/humorous
  snark_level: 0
  # Enable emoji and color in HTML report
  use_icons: true
  use_color: true
